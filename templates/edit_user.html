<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit User | Trekora</title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='admin.css'
        ) }}"
    >

</head>


<body>


<div class="mentor-form-page">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <div class="mentor-form-header">

        <div>

            <span class="section-label">
                CUSTOMER MANAGEMENT
            </span>

            <h1>
                Edit User
            </h1>

            <p>
                Update the registered user account information.
            </p>

        </div>


        <a
            href="{{ url_for('admin_dashboard') }}#users"
            class="mentor-back-button"
        >
            ← Back to Users
        </a>

    </div>



    <!-- =====================================================
         EDIT USER FORM
         ===================================================== -->

    <form
        action="{{ url_for(
            'edit_user',
            user_id=user.id
        ) }}"
        method="POST"
        class="mentor-form-card"
    >


        <!-- =================================================
             ACCOUNT INFORMATION
             ================================================= -->

        <div class="mentor-form-section">

            <h2>
                Account Information
            </h2>

            <p>
                Update the user's basic account details.
            </p>


            <div class="mentor-form-grid">


                <!-- NAME -->

                <div class="mentor-form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="{{ user.name }}"
                        placeholder="Enter full name"
                        required
                    >

                </div>



                <!-- EMAIL -->

                <div class="mentor-form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ user.email }}"
                        placeholder="Enter email address"
                        required
                    >

                </div>



                <!-- PHONE -->

                <div class="mentor-form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="text"
                        id="phone"
                        name="phone"
                        value="{{ user.phone or '' }}"
                        placeholder="Enter phone number"
                    >

                </div>



                <!-- USER ID -->

                <div class="mentor-form-group">

                    <label for="user_id">
                        User ID
                    </label>

                    <input
                        type="text"
                        id="user_id"
                        value="#{{ user.id }}"
                        readonly
                    >

                </div>



                <!-- REGISTERED DATE -->

                <div class="mentor-form-group full">

                    <label for="created_at">
                        Registered On
                    </label>

                    <input
                        type="text"
                        id="created_at"
                        value="{% if user.created_at %}{{ user.created_at.strftime('%d %B %Y, %I:%M %p') }}{% else %}Not available{% endif %}"
                        readonly
                    >

                </div>


            </div>

        </div>



        <!-- =================================================
             ACTION BUTTONS
             ================================================= -->

        <div class="mentor-form-actions">


            <a
                href="{{ url_for('admin_dashboard') }}#users"
                class="mentor-form-cancel"
            >
                Cancel
            </a>


            <button
                type="submit"
                class="mentor-form-submit"
            >
                Update User
            </button>


        </div>


    </form>


</div>


</body>

</html>
